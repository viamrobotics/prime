name: Deploy Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build docs site (includes playgrounds)
        env:
          DOCS_BASE: /prime/
          DOCS_SITE: https://viamrobotics.github.io
        run: pnpm --filter @viamrobotics/prime-docs build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: apps/docs/dist
          publish_branch: gh-pages
          # Preserve pr-preview/* directories deployed by pr-preview.yml.
          keep_files: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: 'docs: deploy ${{ github.sha }}'
