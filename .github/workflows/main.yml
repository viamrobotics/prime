name: Main

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  deploy-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v6

      # Also primes the wireit GitHub Actions cache on every main push, so PR
      # branches get cache hits for unchanged packages.
      - name: Setup
        uses: ./.github/actions/setup
        with:
          registry-url: "https://registry.npmjs.org"

      # Pin to npm 11, not @latest: npm 12 changed `npm info --json` to a top-level
      # array and dropped `error.code` from publish errors, which breaks
      # @changesets/cli@2.31's already-published detection (it republishes and
      # hard-fails). npm 11 keeps the old shape and still supports OIDC trusted
      # publishing (requires >= 11.5.1). Revisit when changesets 3.0 ships stable.
      - name: Pin npm
        run: npm install -g npm@11

      - name: Build 🔧
        run: pnpm build

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
